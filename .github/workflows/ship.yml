name: Ship
# Instinct can't git-push from its workspace, so each change arrives as a
# tarball inside this file, committed through the GitHub web editor.
# This job unpacks it, runs the tests and a real Jev check, and commits only if all pass.
on:
  push:
    branches: [main]
    paths: [".github/workflows/ship.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ship
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unpack
