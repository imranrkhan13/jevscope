          tar -xzf /tmp/payload.tgz
      - name: Test before committing
        run: |
          set -euo pipefail
          (cd jevapi/js && npm test)
          pip install -q pytest && pip install -q -e jevapi/python && pytest -q jevapi/python/tests
          if [ -f api/package.json ]; then (cd api && npm test); fi
          if [ -f web/jevapi/package.json ]; then (cd web/jevapi && npm test); fi
      - name: Live Jev check (real TypeSafe call, blocks the commit if it fails)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          REQUIRE_LIVE_JEV: "1"
        run: node jevapi/spec/live_jev_check.mjs
      - name: Commit
        run: |
          set -euo pipefail
          rm -rf jevapi/python/*.egg-info
          git config user.name "imranrkhan13"
          git config user.email "imranrkhan13@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "JevAPI demo: resume sample now extracts a full 23-field form (contact, two jobs, project, education, skills), so the shorter review layout shows on a long document"
          git push

