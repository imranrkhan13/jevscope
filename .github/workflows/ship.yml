          PAYLOAD
          if tar -tzf /tmp/payload.tgz | grep -E '(^/|\.\./|^\.github/)'; then echo "unsafe path"; exit 1; fi
          tar -xzf /tmp/payload.tgz
      - name: Test before committing
        run: |
          set -euo pipefail
          (cd jevapi/js && npm test)
          pip install -q pytest && pip install -q -e jevapi/python && pytest -q jevapi/python/tests
          if [ -f api/package.json ]; then (cd api && npm test); fi
          if [ -f web/jevapi/package.json ]; then (cd web/jevapi && npm test); fi
      - name: Live Jev check (real TypeSafe call, blocks the commit if it fails)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          REQUIRE_LIVE_JEV: "1"
        run: node jevapi/spec/live_jev_check.mjs
      - name: "Jev extraction-by-verification eval (small: 5 docs, 1 request per doc, bakes spec/jev_extract_eval.json)"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_EXTRACT_EVAL: "1"
        run: node jevapi/spec/jev_extract_eval.mjs
      - name: "Jev vs Lev head-to-head: real Lev v0.2.0 (jlt-commons/lev, Apache-2.0) answers the same extraction questions locally, encoder-only; bakes web/jevapi/samples_vs.json"
        env:
          LEV_URL: "http://127.0.0.1:8080"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libicu-dev libopenblas-dev
          JOLT_VER=$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest | jq -r .tag_name)
          echo "jolt: $JOLT_VER"
          curl -fsSL -o /tmp/jolt.tar.gz "https://github.com/jolt-lang/jolt/releases/download/${JOLT_VER}/jolt-${JOLT_VER}-x86_64-linux.tar.gz"
          mkdir -p "$HOME/.jolt-dist" && tar xzf /tmp/jolt.tar.gz -C "$HOME/.jolt-dist" --strip-components=1
          export PATH="$HOME/.jolt-dist:$PATH"
          git clone -q --depth 1 --branch v0.2.0 https://github.com/jlt-commons/lev "$HOME/lev"
          cd "$HOME/lev"
          jolt kernels
          REV=c5d78730f3493e4fe16d61507ef4b78eef7318cf
          base="https://huggingface.co/convaiinnovations/laya/resolve/${REV}"
          mkdir -p "$HOME/laya/tokenizer" "$HOME/laya/encoder"
          for f in model.safetensors tokenizer/tokenizer.json tokenizer/tokenizer_config.json encoder/config.json rl_agent_config.json; do
            curl -fsSL --retry 3 -o "$HOME/laya/$f" "$base/$f"
          done
          echo "891102d372688fc2a094dac56a384bc537b87c63f21f9f3dac0be2b7cbc8d86c  $HOME/laya/model.safetensors" | sha256sum -c -
          LEV_CHECKPOINTS="$HOME/laya" jolt prepare
          jolt -M:serve --port 8080 &
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "Lev server did not start"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          node jevapi/spec/jev_extract_vs.mjs
      - name: Commit
        run: |
          set -euo pipefail
          rm -rf jevapi/python/*.egg-info
          git config user.name "imranrkhan13"
          git config user.email "imranrkhan13@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Jev vs Lev head-to-head: real Lev v0.2.0 (encoder-only, local) answers the same extraction questions in the ship job; demo gets a Jev vs Lev view per field (bakes web/jevapi/samples_vs.json)"
          git push

