[project]
name = "jevapi"
version = "0.1.0"
description = "Decide, field by field, whether an extracted value is safe to auto-fill or needs a human. Calibrated on your own examples. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["calibration", "confidence", "document extraction", "form filling", "human in the loop", "llm"]

[project.urls]
Source = "https://github.com/imranrkhan13/jevscope"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
